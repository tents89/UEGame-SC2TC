[package]
name = "ue_mod_core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
csv = "1"
rayon = { workspace = true }
locres-rs = "1.0.1"
pelite = "0.10"
reqwest = { version = "0.13", features = ["json", "form", "blocking"] }
opencc-rust = { git = "https://github.com/doggy8088/opencc-rust" }
repak = { git = "https://github.com/trumank/repak", features = ["oodle", "encryption"] }
retoc = { git = "https://github.com/trumank/retoc" }
aes = "0.8"
hex = "0.4"